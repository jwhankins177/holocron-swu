name: Holocron
options:
  bundleIdPrefix: com.jonathon
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Holocron:
    type: application
    platform: iOS
    sources:
      - path: Holocron
        excludes: [Web, Holocron.entitlements]
      - path: Holocron/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathon.holocron
        CODE_SIGN_ENTITLEMENTS: Holocron/Holocron.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Holocron
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  HolocronTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HolocronTests]
    dependencies:
      - target: Holocron
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Holocron:
    build:
      targets:
        Holocron: all
        HolocronTests: [test]
    test:
      targets: [HolocronTests]
